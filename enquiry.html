<main>
<h1>ENQUIRY - CATERING QUOTE</h1>
<p><b>Purpose:</b> Product/service enquiry - calculates cost & availability</p>
<input type="text" id="searchInput" placeholder="Search products..." onkeyup="filterMenu()">
<div id="menu-grid" class="menu-grid"></div>
<h2>Get a Quote</h2>
<form onsubmit="return validateEnquiry(event)">
  <label>Name</label><input type="text" required>
  <label>Phone SA (10 digits)</label><input type="tel" id="phone" placeholder="0821234567" required pattern="0[6-8][0-9]{8}">
  <label>What?</label><select id="meatType" required><option value="wors">Boerewors R95/kg</option><option value="cheese">Cheese Wors R105/kg</option><option value="steak">T-Bone R220/kg</option><option value="combo">Family Combo R550</option></select>
  <label>Quantity</label><select id="kg"><option value="1">1kg</option><option value="2">2kg</option><option value="5">5kg</option><option value="10">10kg Catering</option></select>
  <button type="submit" class="btn">Calculate Cost & Availability</button>
</form>
<div id="result"></div>
</main>
<div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="">

<h1>CONTACT US - GENERAL</h1>
<p><b>Location:</b>Meadowlands, Soweto, Johannesburg</p>
<p><b>Hours:</b>Mon-Sun: 10AM-10PM</p>
<P><b>WhatsApp:</b>065 650 9869</P>
<p><b>Purpose:</b> General message to organisation - compiled into email</p>
<form onsubmit="return validateContact(event)">
  <label>Full Name</label>
  <input type="text" id="name" required minlength="3">
  <label>Email</label>
  <input type="email" id="email" required>
  <label>Type</label>
  <select id="msgType" required>
    <option>General Enquiry</option>
    <option>Complaint</option>
    <option>Compliment</option>
    <option>Sponsorship</option>
    <option>Job Application</option></select>
  <label>Full Message (min 20 chars)</label>
  <textarea id="message" rows="6" required minlength="20"></textarea>
  <button type="submit" class="btn-green">Send via Email</button>
  <p id="error" style="color:red"></p>
</form>
<h2>Find Us</h2>
<div id="map"></div>
